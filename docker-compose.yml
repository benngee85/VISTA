name: vista

# =============================================================================
# World Monitor — Docker / Podman Compose
# =============================================================================
# Self-contained stack: app + Redis + AIS relay.
#
# Quick start:
#   cp .env.example .env        # add your API keys
#   docker compose up -d --build
#
# The app will be available at http://localhost:3000
# =============================================================================

services:

  vista:
    build:
      context: .
      dockerfile: Dockerfile
    image: vista:latest
    container_name: vista
    ports:
      - "${WM_PORT:-3000}:8080"
    environment:
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
      CACHE_REST_URL: "http://redis-rest:8080"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:8080"
      CACHE_REST_TOKEN: "${CACHE_REST_TOKEN:?CACHE_REST_TOKEN required — generate with: openssl rand -hex 32}"
      UPSTASH_REDIS_REST_TOKEN: "${CACHE_REST_TOKEN:?CACHE_REST_TOKEN required — generate with: openssl rand -hex 32}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "true"
      LOCAL_API_CLOUD_FALLBACK_ALLOW_DOCKER: "${LOCAL_API_CLOUD_FALLBACK_ALLOW_DOCKER:-false}"
      WORLDMONITOR_API_KEY: "${WM_API_KEY:-}"
      WORLDMONITOR_SEED_REFRESH_KEY: "${WORLDMONITOR_SEED_REFRESH_KEY:?WORLDMONITOR_SEED_REFRESH_KEY required}"
      VISTA_SELF_HOSTED_API_PLAN_ACCESS: "${VISTA_SELF_HOSTED_API_PLAN_ACCESS:-false}"
      VISTA_API_PLAN_VALIDATION_URL: "${VISTA_API_PLAN_VALIDATION_URL:-https://api.worldmonitor.app/api/economic/v1/list-global-tenders}"
      WS_RELAY_URL: "http://ais-relay:3004"
      # Sovereign entitlement-provider boundary. Hosted remains the safe
      # compatibility default until the local provider is deployed.
      VISTA_DEPLOYMENT_PROFILE: "${VISTA_DEPLOYMENT_PROFILE:-hosted}"
      VISTA_ENTITLEMENT_PROVIDER: "${VISTA_ENTITLEMENT_PROVIDER:-hosted}"
      VISTA_ENTITLEMENT_PROVIDER_URL: "${VISTA_ENTITLEMENT_PROVIDER_URL:-}"
      VISTA_ENTITLEMENT_PROVIDER_TOKEN: "${VISTA_ENTITLEMENT_PROVIDER_TOKEN:-}"
      VISTA_ENTITLEMENT_PROVIDER_TIMEOUT_MS: "${VISTA_ENTITLEMENT_PROVIDER_TIMEOUT_MS:-3000}"
      VISTA_ENTITLEMENT_ALLOW_INSECURE_HTTP: "${VISTA_ENTITLEMENT_ALLOW_INSECURE_HTTP:-false}"
      # Local Anthropic-compatible LLM module. The base URL, model and
      # adapter key are sourced once from .env and shared by every consumer.
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_REASONING_MODEL: "${ANTHROPIC_MODEL:-}"
      LLM_TOOL_MODEL: "${ANTHROPIC_MODEL:-}"
      LLM_REASONING_PROVIDER: "${LLM_REASONING_PROVIDER:-anthropic}"
      LLM_TOOL_PROVIDER: "${LLM_TOOL_PROVIDER:-anthropic}"
      # Cloud providers are intentionally disabled in the self-hosted image.
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Data source API keys (optional — features degrade gracefully)
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      TRAVELPAYOUTS_API_TOKEN: "${TRAVELPAYOUTS_API_TOKEN:-}"
    # Docker secrets (recommended for API keys — keeps them out of docker inspect).
    # Create secrets/ dir with one file per key, then uncomment below.
    # See SELF_HOSTING.md or docker-compose.override.yml for details.
    # secrets:
    #   - GROQ_API_KEY
    #   - AISSTREAM_API_KEY
    #   - FINNHUB_API_KEY
    #   - FRED_API_KEY
    #   - NASA_FIRMS_API_KEY
    #   - LLM_API_KEY
    depends_on:
      redis-rest:
        condition: service_healthy
      ais-relay:
        condition: service_started
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: ais-relay:latest
    container_name: ais-relay
    environment:
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
      WORLDMONITOR_API_BASE_URL: "http://vista:8080"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      MARKET_YAHOO_REFRESH_INTERVAL_MS: "${MARKET_YAHOO_REFRESH_INTERVAL_MS:-900000}"
      CACHE_REST_URL: "http://redis-rest:8080"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:8080"
      CACHE_REST_TOKEN: "${CACHE_REST_TOKEN:?CACHE_REST_TOKEN required — generate with: openssl rand -hex 32}"
      UPSTASH_REDIS_REST_TOKEN: "${CACHE_REST_TOKEN:?CACHE_REST_TOKEN required — generate with: openssl rand -hex 32}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      UCDP_ACCESS_TOKEN: "${UCDP_ACCESS_TOKEN:-}"
      LOCAL_API_MODE: "docker"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      PORT: "3004"
    depends_on:
      redis-rest:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    build:
      context: .
      dockerfile: docker/Dockerfile.rocky9-valkey
    image: vista-valkey:latest
    container_name: vista-valkey
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?VALKEY_PASSWORD required — generate with: openssl rand -hex 32}"
    volumes:
      - valkey-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$VALKEY_PASSWORD valkey-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: vista-redis-rest:latest
    container_name: vista-redis-rest
    ports:
      - "127.0.0.1:8079:8080"
    environment:
      SRH_TOKEN: "${CACHE_REST_TOKEN:?CACHE_REST_TOKEN required — generate with: openssl rand -hex 32}"
      SRH_MAX_BODY_BYTES: "${VISTA_VALKEY_REST_MAX_BODY_BYTES:-16777216}"
      # Defense-in-depth: the Valkey service's --requirepass already fails
      # Compose validation if VALKEY_PASSWORD is unset, but the explicit
      # :? here protects against a future PR removing --requirepass or
      # copying this connection string into a new service.
      SRH_CONNECTION_STRING: "redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD required — generate with: openssl rand -hex 32}@valkey:6379"
    depends_on:
      - valkey
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const token = process.env.SRH_TOKEN || process.env.CACHE_REST_TOKEN || process.env.UPSTASH_REDIS_REST_TOKEN;
          if (!token) process.exit(1);
          fetch('http://127.0.0.1:8080/pipeline', {
            method: 'POST',
            headers: {
              authorization: 'Bearer ' + token,
              'content-type': 'application/json'
            },
            body: JSON.stringify([['PING']]),
            signal: AbortSignal.timeout(5000)
          }).then(async response => {
            const body = await response.text();
            if (!response.ok || !body.includes('PONG')) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# Docker secrets — uncomment and point to your secret files.
# Example: echo "gsk_abc123" > secrets/groq_api_key.txt
# secrets:
#   GROQ_API_KEY:
#     file: ./secrets/groq_api_key.txt
#   AISSTREAM_API_KEY:
#     file: ./secrets/aisstream_api_key.txt
#   FINNHUB_API_KEY:
#     file: ./secrets/finnhub_api_key.txt
#   FRED_API_KEY:
#     file: ./secrets/fred_api_key.txt
#   NASA_FIRMS_API_KEY:
#     file: ./secrets/nasa_firms_api_key.txt
#   LLM_API_KEY:
#     file: ./secrets/llm_api_key.txt

volumes:
  valkey-data:
