openapi: 3.1.0
info:
  title: VISTA Sovereign Entitlement Service
  version: 0.1.0
  description: >
    Sovereign, fail-closed capability entitlement resolution service.
    This service resolves explicitly provisioned entitlement assertions;
    it does not infer or automatically grant commercial capabilities.
paths:
  /v1/entitlements/resolve:
    post:
      operationId: resolveEntitlements
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - subjectId
              properties:
                subjectId:
                  type: string
                  minLength: 1
                  maxLength: 256
                requestedAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Valid entitlement assertion
          content:
            application/json:
              schema:
                type: object
                required:
                  - entitlements
                  - requestId
                properties:
                  entitlements:
                    $ref: "#/components/schemas/Entitlements"
                  requestId:
                    type: string
                    format: uuid
        "400":
          description: Invalid request or subject
        "401":
          description: Invalid service credential
        "404":
          description: Subject has no current entitlement
        "413":
          description: Request body exceeds the bounded limit
        "415":
          description: Unsupported media type
        "503":
          description: Configuration, policy, audit or data tier unavailable
  /health/live:
    get:
      responses:
        "200":
          description: Process is live
  /health/ready:
    get:
      responses:
        "200":
          description: Service configuration and data tier are ready
        "503":
          description: Required dependency unavailable
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  schemas:
    Entitlements:
      type: object
      additionalProperties: true
      required:
        - planKey
        - features
        - validUntil
      properties:
        planKey:
          type: string
          minLength: 1
          maxLength: 128
        validUntil:
          type: number
        features:
          type: object
          required:
            - tier
            - apiAccess
            - apiRateLimit
            - maxDashboards
            - prioritySupport
            - exportFormats
          properties:
            tier:
              type: integer
              minimum: 0
              maximum: 100
            apiAccess:
              type: boolean
            apiRateLimit:
              type: number
              minimum: 0
            maxDashboards:
              type: integer
              minimum: 0
            prioritySupport:
              type: boolean
            exportFormats:
              type: array
              items:
                type: string
            mcpAccess:
              type: boolean
            dataExport:
              type: boolean
